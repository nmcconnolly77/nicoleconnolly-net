<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards | Nicole Connolly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f2a24}a:hover{color:#4a5650}
summary::-webkit-details-marker{display:none}
.ic-open{display:none}
details[open] .ic-open{display:inline-flex}
details[open] .ic-closed{display:none}
.ic-closed{display:inline-flex}
</style>
</head>
<body>
<div style="font-family: Inter, system-ui, sans-serif; background: #eef4f2 linear-gradient(to bottom, #f4f8f7 0%, #eef4f2 35%, #e0ebe7 100%); color: #1f2a24; min-height: 100vh">
  <header style="max-width: 1200px; margin: 0 auto; padding: 32px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
    <a href="home.html" style="font-size: 18px; font-weight: 600; letter-spacing: 0.02em; text-decoration: none">Nicole Connolly</a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 15px">
      <a href="cards.html" aria-current="page" style="text-decoration: none; border-bottom: 1px solid #1f2a24; padding-bottom: 2px">Cards</a>
      <a href="poetry.html" style="text-decoration: none; color: #4a5650">Poetry</a>
      <a href="home.html#contact" style="text-decoration: none; color: #4a5650">Contact</a>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 0 40px">
    <section style="padding: 72px 0 64px; max-width: 760px; margin: 0 auto; text-align: center">
      <p style="margin: 0 0 16px; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #4a5650">Pressed Flower Art</p>
      <h1 style="margin: 0 0 20px; font-size: 52px; line-height: 1.1; font-weight: 500; letter-spacing: -0.02em">Handmade Flower Cards</h1>
      <p style="margin: 0 auto; max-width: 560px; font-size: 17px; line-height: 1.7; color: #2f3a34">A collection of arrangements symbolizing Bible verses that capture the range of human emotion.</p>
    </section>

    <section aria-label="Flower cards" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 48px 32px; padding-bottom: 96px">
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #d5e4df; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #bfcec9; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/job-42-2.jpg" alt="Pressed blue flowers above two maidenhair fern fronds" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Job 42:2</span>
          </figcaption>
        </figure>
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #dbe6dc; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #c4cfc6; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/rev-21-4.jpg" alt="A pressed pale yellow cosmos flower with sprigs of grass" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Rev 21:4</span>
          </figcaption>
        </figure>
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #d9e3e3; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #c3cdcc; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/isa-40-31.jpg" alt="A pressed cream flower beside a branch of grey-green leaves" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Isa 40:31</span>
          </figcaption>
        </figure>
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #d3e1dd; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #bdcbc7; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/psa-34-18.jpg" alt="Pressed pink and lilac flowers beside a fern frond" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Psa 34:18</span>
          </figcaption>
        </figure>
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #dde7df; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #c6d0c9; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/mat-5-4.jpg" alt="A pressed white daisy above two silvery leaves" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Mat 5:4</span>
          </figcaption>
        </figure>
      
        <figure style="margin: 0">
          <div style="aspect-ratio: 5 / 7; box-sizing: border-box; padding: 12%; background: #d6e2e2; display: flex">
            <div style="flex: 1 1 auto; position: relative; overflow: hidden; background: #c0cccb; display: flex; align-items: center; justify-content: center; text-align: center; color: #2f3a34; font-size: 13px"><img src="images/joh-14-27.jpg" alt="Two sprigs of pressed purple flowers arching around a stem of grass" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block"></div>
          </div>
          <figcaption style="padding-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
            <span style="font-weight: 500">Joh 14:27</span>
          </figcaption>
        </figure>
      
    </section>
  </main>

  <footer style="border-top: 1px solid #d6e2de">
    <div style="max-width: 1200px; margin: 0 auto; padding: 32px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: #4a5650">
      <span>All artwork © 2026 Nicole Connolly. Please don't reuse without written permission.</span>
    </div>
  </footer>
</div>
</body>
</html>
